<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Quest Garden</title>
  <meta name="description" content="无聊时抽一张卡，给空出来的几分钟找件想做的小事。" />
  <style>
    :root {
      --ink: #2f2768;
      --paper: #ffffff;
      --soft: #ebe5ff;
      --panel: #f4efff;
      --muted: #5d52aa;
      --sun: #ffe394;
      --lilac: #dcd3ff;
      --note: #fff0ba;
      --line-heavy: #2f2768;
      --line-light: #b9acf3;
      --line: 2px;
      --shadow: 5px 5px 0 0 var(--line-light);
      --shadow-sm: 3px 3px 0 0 var(--line-light);
      --radius: 24px;
    }

    * {
      box-sizing: border-box;
      letter-spacing: 0;
    }

    html,
    body {
      min-height: 100%;
      margin: 0;
      color: var(--ink);
      background: var(--soft);
      font-weight: 400;
      font-family: ui-rounded, "SF Pro Rounded", "PingFang SC", "Microsoft YaHei", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      overflow-x: hidden;
      user-select: none;
    }

    button,
    input,
    select {
      font: inherit;
    }

    button {
      color: inherit;
    }

    .app {
      width: min(1180px, 100%);
      min-height: 100dvh;
      margin: 0 auto;
      background-color: var(--paper);
      border-left: 0;
      border-right: 0;
      position: relative;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: calc(env(safe-area-inset-top, 0px) + 14px) 18px 14px;
      background: var(--paper);
      border-bottom: 0;
    }

    .brand {
      display: flex;
      align-items: center;
      min-width: 0;
      gap: 12px;
    }

    .brand-mark {
      width: 54px;
      height: 54px;
      border: 0;
      border-radius: 18px;
      background: var(--lilac);
      box-shadow: none;
      display: grid;
      place-items: center;
      font-size: 24px;
      flex: 0 0 auto;
      transform: rotate(-2deg);
    }

    .brand-title {
      margin: 0;
      font-size: 28px;
      line-height: 0.94;
      font-weight: 950;
      color: var(--line-heavy);
    }

    .brand-subtitle {
      margin-top: 4px;
      font-size: 12px;
      font-weight: 400;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 0 0 auto;
    }

    .icon-btn,
    .primary-btn,
    .plain-btn,
    .mini-btn,
    .mood-btn {
      border: var(--line) solid var(--line-heavy);
      background: #ffffff;
      box-shadow: var(--shadow-sm);
      cursor: pointer;
      transition: transform 120ms ease, box-shadow 120ms ease, background 120ms ease;
    }

    .icon-btn:active,
    .primary-btn:active,
    .plain-btn:active,
    .mini-btn:active,
    .mood-btn:active {
      transform: translate(3px, 3px);
      box-shadow: 0 0 0 0 var(--ink);
    }

    .icon-btn {
      width: 42px;
      min-width: 42px;
      height: 46px;
      border-radius: 15px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      background: #ffffff;
    }

    .i {
      width: 20px;
      height: 20px;
      stroke: currentColor;
      stroke-width: 2.4;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      flex: 0 0 auto;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .has-tip {
      position: relative;
    }

    .has-tip::after {
      content: attr(data-tip);
      position: absolute;
      left: 50%;
      bottom: calc(100% + 8px);
      transform: translateX(-50%) translateY(4px);
      min-width: max-content;
      max-width: 160px;
      padding: 6px 9px;
      border-radius: 10px;
      background: var(--line-heavy);
      color: var(--paper);
      font-size: 12px;
      font-weight: 400;
      line-height: 1;
      opacity: 0;
      pointer-events: none;
      transition: opacity 120ms ease, transform 120ms ease;
      z-index: 50;
      white-space: nowrap;
    }

    .has-tip:hover::after,
    .has-tip:focus-visible::after {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .top-actions .icon-btn {
      border: 0;
      box-shadow: none;
      background: var(--paper);
    }

    .top-actions .has-tip::after {
      top: calc(100% + 8px);
      bottom: auto;
      transform: translateX(-50%) translateY(-4px);
      z-index: 80;
    }

    .top-actions .has-tip:hover::after,
    .top-actions .has-tip:focus-visible::after {
      transform: translateX(-50%) translateY(0);
    }

    .nav {
      position: relative;
      display: flex;
      align-items: flex-end;
      gap: 12px;
      overflow-x: auto;
      padding: 14px 18px 0;
      background: var(--paper);
      border-bottom: var(--line) solid var(--line-heavy);
      scrollbar-width: none;
    }

    .nav::before {
      content: none;
    }

    .nav::-webkit-scrollbar {
      display: none;
    }

    .tab-btn {
      position: relative;
      z-index: 1;
      flex: 0 0 auto;
      min-width: 128px;
      height: 44px;
      padding: 0 22px;
      margin: 8px 0 0;
      border: var(--line) solid var(--line-heavy);
      border-bottom: 0;
      border-radius: 17px 17px 0 0;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      background: var(--soft);
      color: var(--muted);
      box-shadow: none;
      cursor: pointer;
      transition: background 120ms ease, color 120ms ease;
    }

    .tab-btn.active {
      z-index: 3;
      background: var(--line-heavy);
      color: var(--paper);
      font-weight: 850;
      transform: none;
      box-shadow: none;
    }

    .tab-btn.active::after {
      content: none;
    }

    .nav .tab-btn:active {
      transform: none;
    }

    main {
      padding: 40px 18px 96px;
    }

    .view {
      display: none;
      animation: viewIn 260ms ease both;
    }

    .view.active {
      display: block;
    }

    @keyframes viewIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes cardPop {
      0% {
        transform: translateY(8px) rotate(-0.5deg) scale(0.98);
      }
      100% {
        transform: translateY(0) rotate(0deg) scale(1);
      }
    }

    @keyframes drawButtonPress {
      0% {
        transform: translateY(0) scale(1);
      }
      45% {
        transform: translateY(-2px) scale(1.03);
      }
      100% {
        transform: translateY(0) scale(1);
      }
    }

    .draw-pop {
      animation: cardPop 280ms ease-out both;
    }

    .section-head {
      display: flex;
      align-items: flex-end;
      justify-content: flex-end;
      gap: 16px;
      margin: 0 0 14px;
    }

    .section-note {
      display: none;
    }

    .status-pill {
      flex: 0 0 auto;
      border: 0;
      border-radius: 0;
      padding: 9px 13px;
      background: transparent;
      box-shadow: none;
      font-size: 13px;
      font-weight: 500;
      white-space: nowrap;
    }

    .mood-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
      margin-bottom: 32px;
    }

    .mood-btn {
      min-height: 54px;
      border: 2px solid var(--ink);
      border-radius: 16px;
      padding: 8px 14px;
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: center;
      gap: 12px;
      font-weight: 600;
      background: #ffffff;
    }

    .energy-bars {
      display: inline-flex;
      align-items: flex-end;
      gap: 4px;
      height: 24px;
      flex: 0 0 auto;
    }

    .energy-bars .bar {
      width: 9px;
      border-radius: 4px;
      background: var(--line-light);
    }

    .energy-bars .bar:nth-child(1) {
      height: 10px;
    }

    .energy-bars .bar:nth-child(2) {
      height: 14px;
    }

    .energy-bars .bar:nth-child(3) {
      height: 18px;
    }

    .energy-bars .bar.on {
      background: var(--line-heavy);
    }

    .energy-bars.mini {
      height: 22px;
      gap: 3px;
    }

    .energy-bars.mini .bar {
      width: 7px;
    }

    .mood-btn .label {
      font-size: 13px;
      line-height: 1.1;
    }

    .mood-btn.active {
      background: var(--note);
      box-shadow: none;
      transform: translate(2px, 2px);
      font-weight: 800;
    }

    .today-layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(360px, 0.72fr);
      gap: 24px;
      align-items: start;
    }

    .quest-card {
      position: relative;
      border: var(--line) solid var(--line-heavy);
      border-radius: var(--radius);
      background: var(--paper);
      box-shadow: var(--shadow);
      overflow: hidden;
      padding-bottom: 78px;
      transition: transform 220ms cubic-bezier(.34, 1.56, .64, 1), box-shadow 120ms ease;
    }

    .quest-card.done {
      opacity: 0.76;
      filter: none;
    }

    .quest-card.feature {
      min-height: 430px;
      background: var(--paper);
    }

    .quest-card.feature::before {
      content: "";
      position: absolute;
      top: 18px;
      right: 28px;
      width: 108px;
      height: 22px;
      border-radius: 5px;
      background: var(--note);
      transform: rotate(-4deg);
      z-index: 0;
    }

    .quest-card.alt {
      min-height: 180px;
      background: var(--paper);
      border: 2px solid var(--ink);
      box-shadow: none;
      padding-bottom: 72px;
    }

    .quest-top {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: flex-start;
      padding: 28px 28px 12px;
    }

    .quest-title-wrap {
      min-width: 0;
      flex: 1;
    }

    .quest-kicker {
      display: block;
      position: absolute;
      z-index: 1;
      left: 28px;
      right: 210px;
      bottom: 25px;
      padding: 0;
      border: 0;
      border-radius: 0;
      background: transparent;
      color: var(--muted);
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.04em;
      max-width: 100%;
      text-align: left;
    }

    .quest-title {
      margin: 0;
      font-size: 38px;
      line-height: 1.08;
      font-weight: 950;
      overflow-wrap: anywhere;
    }

    .quest-card.alt .quest-title {
      font-size: 21px;
      line-height: 1.14;
    }

    .quest-body {
      position: relative;
      z-index: 1;
      padding: 10px 28px 22px;
    }

    .quest-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin: 12px 0 18px;
      color: var(--muted);
      font-size: 14px;
      font-weight: 500;
    }

    .energy-meta {
      display: inline-flex;
      align-items: center;
    }

    .quest-meta > span + span::before {
      content: none;
    }

    .quest-prompt {
      margin: 32px 0 0;
      padding: 0;
      border: 0;
      border-radius: 0;
      background: transparent;
      color: var(--muted);
      font-size: 18px;
      font-weight: 400;
      line-height: 1.45;
      max-width: 520px;
    }

    .actions {
      position: relative;
      z-index: 1;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      padding: 0 28px 28px;
    }

    .quest-card.alt .actions {
      padding: 0 18px 18px;
    }

    .quest-card > .actions {
      position: absolute;
      right: 24px;
      bottom: 20px;
      gap: 20px;
      padding: 0;
    }

    .quest-card.alt > .actions {
      right: 18px;
      bottom: 18px;
      padding: 0;
    }

    .quest-card.alt .quest-kicker {
      left: 18px;
      right: 180px;
      bottom: 22px;
    }

    .primary-btn,
    .plain-btn,
    .mini-btn {
      border: 2px solid var(--ink);
      box-shadow: none;
      min-height: 46px;
      border-radius: 14px;
      padding: 0 14px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-weight: 800;
    }

    .primary-btn {
      background: var(--lilac);
    }

    .primary-btn.sun {
      background: var(--sun);
    }

    .primary-btn.peach {
      background: var(--sun);
    }

    .plain-btn {
      background: #ffffff;
    }

    .mini-btn {
      min-height: 38px;
      border-radius: 13px;
      padding: 0 11px;
      font-size: 13px;
    }

    .mini-btn.peach {
      background: transparent;
      color: var(--ink);
    }

    .mini-emoji {
      font-size: 18px;
      line-height: 1;
    }

    .quest-link {
      color: inherit;
      text-decoration: none;
    }

    .action-btn {
      width: 46px;
      min-width: 46px;
      height: 46px;
      padding: 0;
      border-radius: 14px;
    }

    .soft-btn {
      border: 0;
      box-shadow: none;
      background: transparent;
      color: var(--ink);
    }

    .soft-btn:hover {
      background: var(--soft);
    }

    .side-stack {
      display: grid;
      gap: 16px;
    }

    .draw-stage {
      display: grid;
      place-items: center;
      min-height: 560px;
      padding: 28px 0 22px;
    }

    .draw-result {
      width: min(720px, 100%);
      margin: 0 auto;
    }

    .draw-stack {
      padding-top: 28px;
    }

    .draw-card-shell {
      position: relative;
    }

    .draw-card-shell::before,
    .draw-card-shell::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 0;
      width: calc(100% - 28px);
      height: 100%;
      border: var(--line) solid var(--line-heavy);
      border-radius: var(--radius);
      background: var(--soft);
      transform: translateX(-50%) rotate(-3deg);
      z-index: 0;
    }

    .draw-card-shell::after {
      top: 13px;
      width: calc(100% - 14px);
      background: var(--note);
      transform: translateX(-50%) rotate(2.5deg);
    }

    .draw-card-shell .quest-card {
      position: relative;
      z-index: 1;
    }

    .draw-controls {
      position: relative;
      z-index: 2;
      display: flex;
      justify-content: center;
      margin-top: calc(40px + 28px);
    }

    .draw-main-btn {
      position: relative;
      overflow: hidden;
      min-width: 190px;
      height: 54px;
      border: 0;
      border-radius: 18px;
      background: var(--line-heavy);
      color: var(--paper);
      box-shadow: var(--shadow-sm);
    }

    .draw-main-btn.draw-press {
      animation: drawButtonPress 320ms ease-out both;
    }

    .pool-layout {
      display: grid;
      gap: 24px;
    }

    .pool-list-head {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: start;
      gap: 18px;
      padding-left: 32px;
      width: 100%;
    }

    .pool-list-head .status-pill {
      align-self: end;
      justify-self: end;
      padding: 0;
      text-align: right;
    }

    .pool-head-actions {
      align-self: end;
      justify-self: end;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 12px;
      padding: 0 0 8px;
      white-space: nowrap;
    }

    .pool-count {
      color: var(--muted);
      font-size: 18px;
      font-weight: 500;
      line-height: 1;
    }

    .pool-count-item {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      min-height: 28px;
    }

    .pool-count-emoji {
      font-size: 18px;
      line-height: 1;
    }

    .pool-divider {
      width: 1px;
      height: 8px;
      background: var(--line-light);
      opacity: 0.55;
    }

    .storage-toggle {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      min-height: 28px;
      border: 0;
      background: transparent;
      box-shadow: none;
      color: var(--muted);
      padding: 0;
      font-size: 18px;
      font-weight: 500;
      cursor: pointer;
    }

    .storage-toggle.active {
      color: var(--line-heavy);
      font-weight: 700;
    }

    .pool-body {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 340px;
      gap: 32px;
      align-items: start;
    }

    .pool-list {
      min-width: 0;
    }

    .form-panel {
      border: 2px solid var(--ink);
      border-radius: var(--radius);
      background: var(--panel);
      box-shadow: none;
      padding: 16px;
    }

    .form-panel h3 {
      margin: 0 0 14px;
      font-size: 22px;
      font-weight: 850;
    }

    .field {
      display: grid;
      gap: 6px;
      margin-bottom: 12px;
    }

    .field label {
      font-size: 13px;
      font-weight: 500;
    }

    .field input,
    .select-trigger {
      width: 100%;
      height: 46px;
      border: var(--line) solid var(--line-heavy);
      border-radius: 15px;
      background: #ffffff;
      padding: 0 12px;
      box-shadow: none;
      font-weight: 500;
      outline: none;
    }

    .field input:focus,
    .select-trigger:focus-visible {
      background: #fff6d1;
    }

    .custom-select {
      position: relative;
    }

    .select-trigger {
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      text-align: left;
      color: var(--ink);
      appearance: none;
    }

    .select-trigger::after {
      content: "";
      width: 8px;
      height: 8px;
      border-right: 2px solid var(--line-heavy);
      border-bottom: 2px solid var(--line-heavy);
      transform: rotate(45deg) translateY(-2px);
      flex: 0 0 auto;
    }

    .custom-select.open .select-trigger {
      background: var(--note);
    }

    .select-options {
      position: absolute;
      left: 0;
      right: 0;
      top: calc(100% + 6px);
      z-index: 30;
      display: none;
      padding: 7px;
      border: var(--line) solid var(--line-heavy);
      border-radius: 16px;
      background: var(--paper);
      box-shadow: 4px 4px 0 0 var(--line-light);
    }

    .custom-select.open .select-options {
      display: grid;
      gap: 3px;
    }

    .select-option {
      min-height: 36px;
      border: 0;
      border-radius: 11px;
      background: transparent;
      color: var(--ink);
      padding: 0 10px;
      text-align: left;
      font-weight: 500;
      cursor: pointer;
    }

    .select-option:hover,
    .select-option.active {
      background: var(--soft);
      font-weight: 700;
    }

    .two-col {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .pool-toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 34px;
      margin-bottom: 0;
      padding: 0;
      background: transparent;
      border: 0;
      border-radius: 0;
    }

    .pool-filter-btn {
      position: relative;
      min-height: 32px;
      border: 0;
      border-radius: 0;
      box-shadow: none;
      background: transparent;
      color: var(--muted);
      padding: 0;
      font-weight: 600;
      cursor: pointer;
      transition: color 120ms ease, font-size 120ms ease;
    }

    .pool-filter-btn::after {
      content: "";
      position: absolute;
      left: 50%;
      bottom: 0;
      width: 16px;
      height: 3px;
      border-radius: 999px;
      background: transparent;
      transform: translateX(-50%);
    }

    .pool-filter-btn.active {
      color: var(--line-heavy);
      font-size: 17px;
      font-weight: 850;
    }

    .pool-filter-btn.active::after {
      background: var(--sun);
    }

    .pool-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
      gap: 18px;
    }

    .pool-card {
      position: relative;
      border: 2px solid var(--ink);
      border-radius: 26px;
      background: var(--paper);
      box-shadow: none;
      padding: 18px 18px 56px;
      min-height: 190px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .pool-card-head {
      display: flex;
      align-items: flex-start;
      min-width: 0;
    }

    .pool-name {
      margin: 0;
      font-size: 23px;
      line-height: 1.16;
      font-weight: 950;
      overflow-wrap: anywhere;
    }

    .pool-card-bottom {
      position: absolute;
      left: 18px;
      right: 18px;
      bottom: 18px;
      min-height: 30px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin: 0;
    }

    .pool-card-bottom .quest-meta {
      position: static;
      flex: 0 0 auto;
      margin: 0;
    }

    .pool-card .actions {
      position: static;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 16px;
      margin-left: auto;
      padding: 0;
    }

    .pool-card .action-btn {
      width: 30px;
      min-width: 30px;
      height: 30px;

      line-height: 1;

    .history-list {

      border-radius: 18px;
      background: #ffffff;
      box-shadow: none;
      padding: 9px 12px;

    .history-item strong {

      font-size: 14px;
      font-weight: 700;
      line-height: 1.2;

    .history-item span {
      display: block;
      margin-top: 3px;
      font-size: 12px;
      color: var(--muted);

      border-radius: 18px;

      font-weight: 750;

    .history-edit-item span {

      font-size: 12px;
      font-weight: 400;

    .history-edit-btn {

      border-radius: 10px;

      box-shadow: none;

      align-items: center;
      justify-content: center;
      padding: 0;
      cursor: pointer;
      transition: background 120ms ease, transform 120ms ease;

    .trail-card {

      background: #ffffff;
      padding: 18px;

    .trail-head {

      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;

    .trail-head h3 {

      font-size: 20px;

      font-weight: 400;

      gap: 8px;

    .trail-weekdays {

      gap: 8px;
      margin-bottom: 8px;

    .trail-weekday {
      color: var(--muted);
      font-size: 11px;
      font-weight: 500;
      text-align: center;

    .trail-day {
      position: relative;
      aspect-ratio: 1;
      min-height: 42px;

      border-radius: 12px;

      color: var(--ink);

    .trail-day.selected {

    .trail-blank {

      min-height: 42px;

    .trail-day.level-2 {

      background: var(--line-heavy);
      color: #ffffff;

    .trail-date {

      left: 8px;
      top: 6px;
      font-size: 11px;
      font-weight: 500;
    }

    .trail-mark {

      right: 7px;
      bottom: 6px;
      font-size: 15px;
      font-weight: 850;

    .trail-tip {

      font-size: 13px;
      font-weight: 800;

    .trail-tip p {

      line-height: 1.45;

    .trail-detail {

      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;

      font-weight: 850;

    .trail-detail-head span {
      color: var(--muted);

    .empty {

      background: rgba(255, 255, 255, 0.78);

      text-align: center;

      color: var(--muted);

    .toast {

      padding: 12px 16px;

      opacity: 0;

      width: min(420px, calc(100% - 32px));
      text-align: center;

    .toast.show {
      opacity: 1;
      pointer-events: auto;
      transform: translateX(-50%) translateY(0);
    }

    .toast-message {
      min-width: 0;

    .toast-action {

      font-weight: 800;

    function makeQuest(raw, index) {
      return {
        id: raw.id || "q_" + Date.now().toString(36) + "_" + index + "_" + Math.random().toString(36).slice(2, 6),
        title: raw.title,
        category: raw.category,
        energy: raw.energy,
        duration: normalizeDuration(raw.energy, raw.duration),
        tags: raw.tags || [],
        archived: Boolean(raw.archived),
        createdAt: raw.createdAt || new Date().toISOString(),
        completedCount: Number(raw.completedCount || 0),
        lastCompletedAt: raw.lastCompletedAt || null
      };
    }

    function defaultState() {
      const quests = sampleQuests.map(makeQuest);
      return {
        dataVersion: DATA_VERSION,
        mood: "normal",
        activeTab: "today",
        poolFilter: "全部",
        showStorageBox: false,
        currentDrawId: null,
        trailSelectedDate: todayKey,
        quests,
        daily: { date: "", mainQuestId: null, backupQuestIds: [], completedIds: [] },
        dailyByMood: {},
        history: []
      };
    }

    function readStoredState() {
      for (const key of [STORAGE_KEY, ...LEGACY_STORAGE_KEYS]) {
        try {
          const saved = JSON.parse(localStorage.getItem(key));
          if (saved && Array.isArray(saved.quests)) {
            if (key !== STORAGE_KEY) localStorage.setItem(STORAGE_KEY, JSON.stringify(saved));
            return saved;
          }
        } catch (error) {
          // Ignore broken local saves and continue to the next key.
        }
      }
      return null;
    }

    function normalizeStoredState(saved) {
      saved.quests = saved.quests.map(makeQuest);
      if (Number(saved.dataVersion || 0) < DATA_VERSION) {
        const existingTitles = new Set(saved.quests.map(quest => quest.title));
        const additions = sampleQuests
          .filter(quest => quest.category === "漫游" && !existingTitles.has(quest.title))
          .map((quest, index) => makeQuest(quest, saved.quests.length + index));
        saved.quests.push(...additions);
      }
      saved.dataVersion = DATA_VERSION;
      saved.history = Array.isArray(saved.history) ? saved.history : [];
      saved.daily = saved.daily || { date: "", mainQuestId: null, backupQuestIds: [], completedIds: [] };
      saved.dailyByMood = saved.dailyByMood && typeof saved.dailyByMood === "object" ? saved.dailyByMood : {};
      const dailyMainIds = new Set([saved.daily.mainQuestId, ...Object.values(saved.dailyByMood).map(day => day?.mainQuestId)].filter(Boolean));
      if (dailyMainIds.has(saved.currentDrawId)) saved.currentDrawId = null;
      saved.showStorageBox = Boolean(saved.showStorageBox);
      if (typeof saved.trailSelectedDate !== "string" || !saved.trailSelectedDate) saved.trailSelectedDate = todayKey;
      if (!moods.some(mood => mood.id === saved.mood)) saved.mood = "normal";
      if (saved.activeTab === "record") saved.activeTab = "map";
      return saved;
    }

    function loadState() {
      const saved = readStoredState();
      if (!saved) return defaultState();
      const normalized = normalizeStoredState(saved);
      localStorage.setItem(STORAGE_KEY, JSON.stringify(normalized));
      return normalized;
    }

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(app));
    }

    function backupFileName() {
      const date = new Date().toLocaleDateString("en-CA");
      return `quest-garden-backup-${date}.json`;
    }

    function exportBackup() {
      const backup = {
        ...app,
        backupType: "quest-garden",
        dataVersion: DATA_VERSION,
        exportedAt: new Date().toISOString()
      };
      const blob = new Blob([JSON.stringify(backup, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = backupFileName();
      document.body.appendChild(link);
      link.click();
      link.remove();
      window.setTimeout(() => URL.revokeObjectURL(url), 0);
      showToast("备份文件已导出。");
    }

    function importBackup(file) {
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const parsed = JSON.parse(String(reader.result || ""));
          const nextState = parsed?.state && Array.isArray(parsed.state.quests) ? parsed.state : parsed;
          if (!nextState || !Array.isArray(nextState.quests)) throw new Error("Invalid backup");
          if (!window.confirm("导入备份会覆盖当前数据，继续吗？")) return;
          app = normalizeStoredState(nextState);
          saveState();
          ensureDaily();
          render();
          showToast("备份已经导入。");
        } catch (error) {
          showToast("这个备份文件读取失败。");
        }
      };
      reader.onerror = () => showToast("这个备份文件读取失败。");
      reader.readAsText(file);
    }

    function getMood() {
      return moods.find(mood => mood.id === app.mood) || moods[1];
    }

    function getEnergyLabel(energy) {
      return { low: "低能量", medium: "中能量", high: "高能量" }[energy] || "任意能量";
    }

    function getEnergyLevel(energy) {
      return { low: 1, medium: 2, high: 3 }[energy] || 1;
    }

    function normalizeDuration(energy, duration) {
      const value = Number(duration);
      return [5, 15, 30].includes(value) ? value : durationByEnergy[energy] || 15;
    }

    function completedTodayIds() {
      return Array.isArray(app.daily?.completedIds) ? app.daily.completedIds : [];
    }

    function isCompletedToday(id) {
      return Boolean(id && completedTodayIds().includes(id));
    }

    function eligibleQuests() {
      const allowed = getMood().energies;
      return app.quests.filter(quest => !quest.archived && allowed.includes(quest.energy) && !isCompletedToday(quest.id));
    }

    function drawableQuests() {
      return app.quests.filter(quest => !quest.archived && !isCompletedToday(quest.id));
    }

    function pickMany(count, source, avoidIds = []) {
      const available = source.filter(quest => !avoidIds.includes(quest.id));
      const picked = [];
      const bag = [...available];
      while (picked.length < count && bag.length) {
        const index = Math.floor(Math.random() * bag.length);
        picked.push(bag.splice(index, 1)[0]);
      }
      return picked;
    }

    function pickOneQuest(avoidIds = []) {
      const pool = eligibleQuests();
      return pickMany(1, pool, avoidIds)[0] || null;
    }

    function pickOneDrawQuest(avoidIds = [], options = {}) {
      const pool = drawableQuests();
      const avoidList = avoidIds.filter(Boolean);
      if (options.varyEnergy && avoidList.length) {
        const previous = getQuest(avoidList[0]);
        const variedPool = pool.filter(quest => !avoidList.includes(quest.id) && (!previous || quest.energy !== previous.energy));
        if (variedPool.length) return pickMany(1, variedPool)[0] || null;
      }
      return pickMany(1, pool, avoidList)[0] || pool.find(quest => !avoidList.includes(quest.id)) || pool[0] || null;
    }

    function syncDailyCache() {
      app.dailyByMood = app.dailyByMood && typeof app.dailyByMood === "object" ? app.dailyByMood : {};
      app.dailyByMood[app.mood] = app.daily;
    }

    function getVisibleQuest(id) {
      const quest = getQuest(id);
      if (!quest || quest.archived || isCompletedToday(id)) return null;
      return quest;
    }

    function replaceCompletedQuest(completedId) {
      const backupIds = app.daily.backupQuestIds || [];
      const completed = completedTodayIds();

      if (app.daily.mainQuestId === completedId) {
        const replacement = pickOneQuest([...completed, ...backupIds]);
        app.daily.mainQuestId = replacement ? replacement.id : null;
      }

      const index = backupIds.indexOf(completedId);
      if (index >= 0) {
        const replacement = pickOneQuest([...completed, app.daily.mainQuestId, ...backupIds]);
        if (replacement) {
          app.daily.backupQuestIds[index] = replacement.id;
        } else {
          app.daily.backupQuestIds.splice(index, 1);
        }
      }

      if (isCompletedToday(app.currentDrawId)) {
        const replacement = pickOneDrawQuest([...completed, app.daily.mainQuestId, ...(app.daily.backupQuestIds || [])]);
        app.currentDrawId = replacement ? replacement.id : null;
      }

      syncDailyCache();
    }

    function ensureDaily(force = false) {
      app.dailyByMood = app.dailyByMood && typeof app.dailyByMood === "object" ? app.dailyByMood : {};
      const currentDaily = app.dailyByMood[app.mood] || app.daily || { date: "", mainQuestId: null, backupQuestIds: [], completedIds: [] };
      app.daily = currentDaily;
      app.daily.completedIds = Array.isArray(app.daily.completedIds) ? app.daily.completedIds : [];
      app.daily.backupQuestIds = Array.isArray(app.daily.backupQuestIds) ? app.daily.backupQuestIds : [];
      const dailyIds = [currentDaily.mainQuestId, ...(currentDaily.backupQuestIds || [])].filter(Boolean);
      const dailyStillExists = dailyIds.every(id => app.quests.some(quest => quest.id === id && !quest.archived));
      const hasCompletedVisible = dailyIds.some(isCompletedToday);
      if (!force && currentDaily.date === todayKey && currentDaily.mood === app.mood && dailyStillExists && currentDaily.mainQuestId && !hasCompletedVisible) {
        return;
      }

      const keptCompletedIds = !force && currentDaily.date === todayKey ? [...completedTodayIds()] : [];
      app.daily.completedIds = keptCompletedIds;
      const pool = eligibleQuests();
      const picked = pickMany(3, pool);
      app.daily = {
        date: todayKey,
        mood: app.mood,
        mainQuestId: picked[0] ? picked[0].id : null,
        backupQuestIds: picked.slice(1, 3).map(quest => quest.id),
        completedIds: keptCompletedIds
      };
      app.dailyByMood[app.mood] = app.daily;
      saveState();
    }

    function getQuest(id) {
      return app.quests.find(quest => quest.id === id);
    }

    function createRealmStats() {
      return Object.fromEntries(realmFilters.map(realm => [realm.id, 0]));
    }

    function realmForCategory(category) {
      if (categories[category]) return category;
      if (legacyCategoryRealms[category]) return legacyCategoryRealms[category];
      const realm = realmFilters.find(filter => filter.categories.includes(category));
      return realm ? realm.id : null;
    }

    function categoryStats() {
      const stats = createRealmStats();
      for (const item of app.history) {
        const realm = realmForCategory(item.category);
        if (realm) stats[realm] += 1;
      }
      return stats;
    }

    function questPoolCategoryStats() {
      const stats = createRealmStats();
      for (const quest of app.quests) {
        const realm = realmForCategory(quest.category);
        if (!quest.archived && realm) stats[realm] += 1;
      }
      return stats;
    }

    function topCategory(stats = categoryStats()) {
      const entries = Object.entries(stats).sort((a, b) => b[1] - a[1]);
      return entries[0] || null;
    }

    function recentCategories(limit = 3) {
      const seen = [];
      for (const item of [...app.history].reverse()) {
        if (!seen.includes(item.category)) seen.push(item.category);
        if (seen.length >= limit) break;
      }
      return seen;
    }

    function questPrompt(quest) {
      if (!quest) return "";
      if (questPromptByTitle[quest.title]) return questPromptByTitle[quest.title];
      const prompts = {
        "放松": "给自己留一小段回神的时间。",
        "灵感": "让眼睛先去旅行，喜欢的就留下。",
        "漫游": "顺着好奇心走一小段路。",
        "创作": "做出一个版本，让想法有形状。",
        "整理": "从一个角落开始，让空间轻一点。",
        "项目": "给未来的花园铺一块小路石。"
      };
      return prompts[quest.category] || "随手做一点也很好。";
    }

    function energyBars(level, isMini = false) {
      const safeLevel = Math.max(1, Math.min(3, Number(level) || 1));
      const bars = Array.from({ length: 3 }, (_, index) => `<span class="bar ${index < safeLevel ? "on" : ""}"></span>`).join("");
      return `<span class="energy-bars ${isMini ? "mini" : ""}" aria-hidden="true">${bars}</span>`;
    }

    function energyMeta(quest) {
      return `<span class="energy-meta" aria-label="${getEnergyLabel(quest.energy)}">${energyBars(getEnergyLevel(quest.energy), true)}<span class="sr-only">${getEnergyLabel(quest.energy)}</span></span>`;
    }

    function questExternalLink(quest) {
      const title = quest?.title || "";
      const linkRules = [
        { test: /图寻/, url: "https://tuxun.fun/", label: "打开图寻" },
        { test: /Pinterest/i, url: "https://www.pinterest.com/", label: "打开 Pinterest" },
        { test: /Instagram/i, url: "https://www.instagram.com/", label: "打开 Instagram" },
        { test: /Shorts/i, url: "https://www.youtube.com/shorts", label: "打开 YouTube Shorts" },
        { test: /YouTube/i, url: "https://www.youtube.com/", label: "打开 YouTube" },
        { test: /(^|[\s，、])X($|[\s，、])/, url: "https://x.com/", label: "打开 X" },
        { test: /Google 地图|地图|街景|海边小镇|老城区|沿着一条河/, url: "https://www.google.com/maps", label: "打开 Google 地图" },
        { test: /维基|Wiki|历史|王朝|人物故事|历史人物/, url: "https://zh.wikipedia.org/", label: "打开维基百科" }
      ];

    function questCard(quest, options = {}) {
      if (!quest) return `<div class="empty">Quest 池空空的，先种下一颗新种子。</div>`;
      const done = app.daily.completedIds.includes(quest.id);
      const cardClass = options.feature ? "quest-card feature" : "quest-card alt";
      const ribbon = "";
      const roleLabel = options.label || (options.feature ? "今日主卡" : "备用卡");

    function customSelectOptions(type) {
      if (type === "category") return Object.keys(categories).map(category => ({ value: category, label: category }));
      if (type === "energy") return energyOptions;
      return durationOptions.map(option => ({ value: option.value, label: option.label }));

    function selectElements(type) {
      const ids = {
        category: "questCategory",
        energy: "questEnergy",
        duration: "questDuration"
      };
      const input = document.getElementById(ids[type]);
      return {
        input,
        root: document.querySelector(`[data-select="${type}"]`),
        button: document.getElementById(ids[type] + "Button"),
        options: document.getElementById(ids[type] + "Options")
      };
    }

    function renderCustomSelect(type) {
      const { options } = selectElements(type);
      if (!options) return;
      options.innerHTML = customSelectOptions(type).map(option => `
        <button class="select-option" type="button" role="option" data-select-type="${type}" data-select-value="${escapeHtml(option.value)}">${escapeHtml(option.label)}</button>
      `).join("");
    }

    function setCustomSelect(type, value, shouldSync = true) {
      const { input, button, options } = selectElements(type);
      const choices = customSelectOptions(type);
      const choice = choices.find(option => String(option.value) === String(value)) || choices[0];
      if (!choice || !input || !button || !options) return;
      input.value = choice.value;
      button.querySelector("span").textContent = choice.label;
      options.querySelectorAll(".select-option").forEach(option => {
        const active = option.dataset.selectValue === String(choice.value);
        option.classList.toggle("active", active);
        option.setAttribute("aria-selected", active ? "true" : "false");
      });

      if (shouldSync && type === "energy") {
        setCustomSelect("duration", String(durationByEnergy[choice.value]), false);
      }
      if (shouldSync && type === "duration") {
        setCustomSelect("energy", energyByDuration[choice.value] || "medium", false);
      }
    }

      ["category", "energy", "duration"].forEach(renderCustomSelect);
      const currentEnergy = document.getElementById("questEnergy").value || "low";

    function radarPoint(index, total, ratio, radius = 154, center = 210) {
      const angle = -Math.PI / 2 + (Math.PI * 2 * index) / total;
      return {
        x: center + Math.cos(angle) * radius * ratio,
        y: center + Math.sin(angle) * radius * ratio
      };
    }

    function radarPointList(entries, maxValue, ratioOverride = null) {
      return entries.map((entry, index) => {
        const ratio = ratioOverride ?? (maxValue ? Math.max(0.08, entry.value / maxValue) : 0.08);
        const point = radarPoint(index, entries.length, ratio);
        return `${point.x.toFixed(1)},${point.y.toFixed(1)}`;
      }).join(" ");
    }

    function renderRadarChart(entries) {
      const maxValue = Math.max(1, ...entries.map(entry => entry.value));
      const grid = [0.25, 0.5, 0.75, 1].map(level => `<polygon class="radar-grid" points="${radarPointList(entries, maxValue, level)}"></polygon>`).join("");
      const axes = entries.map((entry, index) => {
        const point = radarPoint(index, entries.length, 1);
        return `<line class="radar-axis" x1="210" y1="210" x2="${point.x.toFixed(1)}" y2="${point.y.toFixed(1)}"></line>`;
      }).join("");
      const points = radarPointList(entries, maxValue);
      const dots = entries.map((entry, index) => {
        const ratio = Math.max(0.08, entry.value / maxValue);
        const point = radarPoint(index, entries.length, ratio);
        return `<circle class="radar-dot" cx="${point.x.toFixed(1)}" cy="${point.y.toFixed(1)}" r="5"></circle>`;
      }).join("");
      const labels = entries.map((entry, index) => {
        const point = radarPoint(index, entries.length, 1.18);
        return `<text class="radar-label" x="${point.x.toFixed(1)}" y="${point.y.toFixed(1)}">${escapeHtml(entry.category)}</text>`;
      }).join("");

      return `
        <svg class="radar-chart" viewBox="0 0 420 420" role="img" aria-label="兴趣领域雷达图">
          ${grid}
          ${axes}
          <polygon class="radar-fill" points="${points}"></polygon>
          ${dots}
          ${labels}
        </svg>
      `;
    }

    function dateKeyFromISO(value) {
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return "";
      return date.toLocaleDateString("en-CA");
    }

    function dateKeyFromDate(date) {
      return date.toLocaleDateString("en-CA");
    }

    function formatTrailDate(key) {
      const date = new Date(key + "T00:00:00");
      if (Number.isNaN(date.getTime())) return key;
      return `${date.getMonth() + 1} 月 ${date.getDate()} 日`;
    }

    function formatHistoryDateTime(value) {
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return "时间未知";
      const time = `${String(date.getHours()).padStart(2, "0")}:${String(date.getMinutes()).padStart(2, "0")}`;
      if (dateKeyFromISO(value) === todayKey) return `今天 ${time}`;
      return `${date.getMonth() + 1} 月 ${date.getDate()} 日 ${time}`;
    }

    function historyTime(value) {
      const time = new Date(value).getTime();
      return Number.isNaN(time) ? 0 : time;
    }

    function trailLevel(count) {
      if (count >= 4) return 3;
      if (count >= 2) return 2;
      if (count >= 1) return 1;
      return 0;
    }

    function renderTrailCalendar() {
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      let selectedDay = app.trailSelectedDate || todayKey;
      const monthStart = new Date(today.getFullYear(), today.getMonth(), 1);
      const monthEnd = new Date(today.getFullYear(), today.getMonth() + 1, 0);
      const leadingBlanks = (monthStart.getDay() + 6) % 7;
      const days = [];
      for (let day = 1; day <= monthEnd.getDate(); day += 1) {
        days.push(new Date(today.getFullYear(), today.getMonth(), day));
      }
      const trailingBlanks = (7 - ((leadingBlanks + days.length) % 7)) % 7;

      const dayKeys = days.map(dateKeyFromDate);
      if (!dayKeys.includes(selectedDay)) {
        selectedDay = todayKey;
        app.trailSelectedDate = todayKey;
      }
      const byDate = Object.fromEntries(dayKeys.map(day => [day, []]));
      for (const item of app.history) {
        const key = dateKeyFromISO(item.completedAt);
        if (byDate[key]) byDate[key].push(item);
      }

      const walkedDays = Object.values(byDate).filter(items => items.length > 0).length;
      const blanks = Array.from({ length: leadingBlanks }, () => `<div class="trail-blank" aria-hidden="true"></div>`).join("");
      const tailBlanks = Array.from({ length: trailingBlanks }, () => `<div class="trail-blank" aria-hidden="true"></div>`).join("");
      const weekdays = ["一", "二", "三", "四", "五", "六", "日"].map(day => `<span class="trail-weekday">${day}</span>`).join("");
      const cells = days.map(date => {
        const day = dateKeyFromDate(date);
        const items = byDate[day];
        const isFuture = date > today;
        const isToday = day === todayKey;
        const isSelected = day === selectedDay;
        const count = items.length;
        const level = trailLevel(count);
        const realms = [...new Set(items.map(item => realmForCategory(item.category)).filter(Boolean))];
        const titles = items.slice(0, 3).map(item => item.title);
        const more = count > 3 ? ` 等 ${count} 个 Quest` : "";
        const tip = count
          ? `<span class="trail-tip"><strong>${formatTrailDate(day)} · ${count} 个 Quest</strong><p>${escapeHtml(realms.join("、") || "小路")}：${escapeHtml(titles.join(" / ") + more)}</p></span>`
          : "";
        return `
          <button class="trail-day level-${level} ${count ? "has-trail" : ""} ${isFuture ? "future" : ""} ${isToday ? "today" : ""} ${isSelected ? "selected" : ""}" type="button" data-action="select-trail-day" data-id="${day}" aria-pressed="${isSelected ? "true" : "false"}" aria-label="${formatTrailDate(day)}${count ? `，完成 ${count} 个 Quest` : ""}${isToday ? "，今天" : ""}" ${isFuture ? "disabled" : ""}>
            <span class="trail-date">${Number(day.slice(-2))}</span>
            ${count ? `<span class="trail-mark">${count}</span>${tip}` : ""}
          </button>
        `;
      }).join("");

      document.getElementById("trailCalendar").innerHTML = `
        <div class="trail-head">
          <h3>足迹月历</h3>
          <span>${today.getMonth() + 1} 月 · ${walkedDays ? `${walkedDays} 天有小路亮起` : "还没有留下足迹"}</span>
        </div>
        <div class="trail-weekdays">${weekdays}</div>
        <div class="trail-grid">${blanks}${cells}${tailBlanks}</div>
        ${renderTrailDayDetails(selectedDay)}
      `;
    }

    function historyEntriesForDate(day) {
      return app.history
        .map((entry, index) => ({ entry, index }))
        .filter(({ entry }) => dateKeyFromISO(entry.completedAt) === day)
        .sort((a, b) => historyTime(b.entry.completedAt) - historyTime(a.entry.completedAt));
    }

    function renderTrailDayDetails(day) {
      const entries = historyEntriesForDate(day);
      const countText = entries.length ? `${entries.length} 个 Quest` : "还没有足迹";

      return `
        <div class="trail-detail">
          <div class="trail-detail-head">
            <h4>${escapeHtml(formatTrailDate(day))}</h4>
            <span>${countText}</span>
          </div>
          ${entries.length ? `
            <div class="history-edit-list">
              ${entries.map(({ entry, index }) => `
                <div class="history-edit-item">
                  <div class="history-edit-copy">
                    <strong>${escapeHtml(entry.title || "未命名 Quest")}</strong>
                    <span>${escapeHtml(entry.category || "未分类")} · ${escapeHtml(formatHistoryDateTime(entry.completedAt))}</span>
                  </div>
                  <button class="history-edit-btn has-tip" type="button" data-action="remove-history" data-id="${index}" data-tip="撤回足迹" title="撤回足迹" aria-label="撤回 ${escapeHtml(entry.title || "这条足迹")}">
                    <svg class="i"><use href="#i-remove"></use></svg>
                  </button>
                </div>
              `).join("")}
            </div>
          ` : `<div class="history-empty">这天还没有足迹。</div>`}
        </div>
      `;
    }

    function renderMap() {
      const usingHistory = app.history.length > 0;
      const stats = usingHistory ? categoryStats() : questPoolCategoryStats();
      const entries = realmFilters.map(realm => ({
        category: realm.label,
        value: stats[realm.id] || 0
      }));
      const total = entries.reduce((sum, entry) => sum + entry.value, 0);
      const top = topCategory(stats);
      const sourceLabel = usingHistory ? "小路足迹" : "花园分布";
      const realmTitle = usingHistory ? "最近亮起的领域" : "花园里的领域";
      const realmStatus = usingHistory ? "最近亮起" : "花园偏向";

      document.getElementById("adventureMap").innerHTML = renderRadarChart(entries);
      renderTrailCalendar();
      document.getElementById("activeRealm").textContent = top ? `${realmStatus}：${top[0]}` : "还在散步";

      const sorted = [...entries].sort((a, b) => b.value - a.value);
      document.getElementById("mapStats").innerHTML = `
        <div class="stat-card">
          <h3>${sourceLabel}</h3>
          <div class="stat-number"><strong>${total}</strong><span>${usingHistory ? "次" : "张"}</span></div>
        </div>
        <div class="badge-card">
          <h3>${realmTitle}</h3>
          <div class="history-list">
            ${sorted.map(entry => `
              <div class="history-item"><div><strong>${escapeHtml(entry.category)}</strong></div><div>${entry.value}</div></div>
            `).join("")}
          </div>
        </div>
      `;
    }

    function removeCompletedTodayFlag(questId) {
      if (!questId) return;
      const stillCompletedToday = app.history.some(item => item.questId === questId && dateKeyFromISO(item.completedAt) === todayKey);
      if (stillCompletedToday) return;

      const removeFromDay = day => {
        if (!day || day.date !== todayKey || !Array.isArray(day.completedIds)) return;
        day.completedIds = day.completedIds.filter(item => item !== questId);
      };

      removeFromDay(app.daily);
      Object.values(app.dailyByMood || {}).forEach(removeFromDay);
    }

    function refreshQuestCompletionMeta(questId) {
      const quest = getQuest(questId);
      if (!quest) return;
      quest.completedCount = Math.max(0, Number(quest.completedCount || 0) - 1);
      const latest = app.history
        .filter(item => item.questId === questId)
        .sort((a, b) => historyTime(b.completedAt) - historyTime(a.completedAt))[0];
      quest.lastCompletedAt = latest ? latest.completedAt : null;
    }

    function removeHistoryEntry(index) {
      const historyIndex = Number(index);
      if (!Number.isInteger(historyIndex) || historyIndex < 0 || historyIndex >= app.history.length) return;
      const [entry] = app.history.splice(historyIndex, 1);
      if (!entry) return;
      refreshQuestCompletionMeta(entry.questId);
      if (dateKeyFromISO(entry.completedAt) === todayKey) removeCompletedTodayFlag(entry.questId);
      saveState();
      render();
      showToast("这条足迹已撤回。");
    }

    function completionMessage() {
      const messages = [
        "这一步已经很好了。",
        "今天的小路亮了一格。",
        "这个兴趣被轻轻照顾到了。",
        "不用继续也可以，停在这里也很好。",
        "你刚刚给自己留了一点光。"
      ];
      return messages[Math.floor(Math.random() * messages.length)];
    }

    function bindDynamicActions() {
      document.querySelectorAll("[data-mood]").forEach(button => {
        button.onclick = () => {
          app.mood = button.dataset.mood;
          ensureDaily();
          saveState();
          render();
        };
      });

      document.querySelectorAll("[data-filter]").forEach(button => {
        button.onclick = () => {
          app.poolFilter = button.dataset.filter;
          app.showStorageBox = false;
          saveState();
          renderPool();
          bindDynamicActions();
        };
      });

      document.querySelectorAll(".select-trigger").forEach(button => {
        button.onclick = event => {
          event.stopPropagation();
          const root = button.closest(".custom-select");
          const wasOpen = root.classList.contains("open");
          document.querySelectorAll(".custom-select.open").forEach(select => {
            select.classList.remove("open");
            select.querySelector(".select-trigger")?.setAttribute("aria-expanded", "false");
          });
          root.classList.toggle("open", !wasOpen);
          button.setAttribute("aria-expanded", !wasOpen ? "true" : "false");
        };
      });

      document.querySelectorAll("[data-select-value]").forEach(button => {
        button.onclick = event => {
          event.stopPropagation();
          const type = button.dataset.selectType;
          setCustomSelect(type, button.dataset.selectValue, true);
          const root = button.closest(".custom-select");
          root.classList.remove("open");
          root.querySelector(".select-trigger")?.setAttribute("aria-expanded", "false");
        };
      });

      if (!window.__questSelectOutsideBound) {
        window.__questSelectOutsideBound = true;
        document.addEventListener("click", () => {
          document.querySelectorAll(".custom-select.open").forEach(select => {
            select.classList.remove("open");
            select.querySelector(".select-trigger")?.setAttribute("aria-expanded", "false");
          });
        });
      }

      document.querySelectorAll("[data-action]").forEach(button => {
        button.onclick = () => handleAction(button.dataset.action, button.dataset.id);
      });
    }

    function handleAction(action, id) {
      if (action === "draw-next") {
        drawQuest(app.currentDrawId, { activateDraw: false });
        return;
      }

      if (action === "toggle-storage") {
        app.showStorageBox = !app.showStorageBox;
        saveState();
        renderPool();
        bindDynamicActions();
        showToast(app.showStorageBox ? "收纳盒打开了。" : "回到 Quest 池。");
        return;
      }

      if (action === "remove-history") {
        removeHistoryEntry(id);
        return;
      }

      if (action === "select-trail-day") {
        app.trailSelectedDate = id || todayKey;
        saveState();
        renderMap();
        bindDynamicActions();
        return;
      }

      const quest = getQuest(id);
      if (!quest) return;

      if (action === "complete") {
        const isBackfill = app.activeTab === "pool";
        if (app.daily.completedIds.includes(id)) {
          showToast("这张 Quest 今天已经留下足迹。");
          return;
        }
        const completedAt = new Date().toISOString();
        app.daily.completedIds.push(id);
        quest.completedCount += 1;
        quest.lastCompletedAt = completedAt;
        const historyEntry = {
          questId: quest.id,
          title: quest.title,
          category: quest.category,
          duration: quest.duration,
          energy: quest.energy,
          completedAt
        };
        app.history.push(historyEntry);
        app.trailSelectedDate = todayKey;
        replaceCompletedQuest(id);
        showToast(isBackfill ? "已补记到今日足迹。" : completionMessage(), {
          label: "撤回",
          duration: 4800,
          onClick: () => removeHistoryEntry(app.history.indexOf(historyEntry))
        });
      }

      if (action === "reroll-main") {
        rerollDailyMain(id);
        return;
      }

      if (action === "reroll-backup") {
        rerollDailyBackup(id);
        return;
      }

      if (action === "reroll-draw" || action === "reroll") {
        drawQuest(id, { activateDraw: false });
        return;
      }

      if (action === "archive") {
        quest.archived = true;
        if (app.currentDrawId === id) app.currentDrawId = null;
        showToast("这张卡先放进收纳盒。");
      }

      if (action === "restore") {
        quest.archived = false;
        showToast("这张卡回到 Quest 池了。");
      }

      if (action === "remove") {
        if (!window.confirm("确认永久移除这张卡吗？历史足迹会保留。")) return;
        app.quests = app.quests.filter(item => item.id !== id);
        if (app.currentDrawId === id) app.currentDrawId = null;
        if (app.daily?.mainQuestId === id) app.daily.mainQuestId = null;
        app.daily.backupQuestIds = (app.daily.backupQuestIds || []).filter(item => item !== id);
        app.daily.completedIds = (app.daily.completedIds || []).filter(item => item !== id);
        Object.values(app.dailyByMood || {}).forEach(day => {
          if (day.mainQuestId === id) day.mainQuestId = null;
          day.backupQuestIds = (day.backupQuestIds || []).filter(item => item !== id);
          day.completedIds = (day.completedIds || []).filter(item => item !== id);
        });
        showToast("这张卡已经移走。");
      }

      saveState();
      render();
    }

    function rerollDailyMain(avoidId) {
      const backupIds = app.daily.backupQuestIds || [];
      const quest = pickOneQuest([avoidId, ...backupIds]);
      if (!quest) return;
      app.daily.mainQuestId = quest.id;
      syncDailyCache();
      saveState();
      render();
      showToast("今日主卡已换一张。");
    }

    function rerollDailyBackup(avoidId) {
      const backupIds = app.daily.backupQuestIds || [];
      const index = backupIds.indexOf(avoidId);
      if (index < 0) return;
      const quest = pickOneQuest([avoidId, app.daily.mainQuestId, ...backupIds]);
      if (!quest) return;
      app.daily.backupQuestIds[index] = quest.id;
      syncDailyCache();
      saveState();
      render();
      showToast("备用卡已换一张。");
    }

    function drawQuest(avoidId = null, options = {}) {
      const { activateDraw = true } = options;
      const trigger = document.querySelector("[data-action='draw-next']");
      if (trigger) {
        trigger.classList.remove("draw-press");
        void trigger.offsetWidth;
        trigger.classList.add("draw-press");
        window.setTimeout(() => trigger.classList.remove("draw-press"), 360);
      }
      const quest = pickOneDrawQuest(avoidId ? [avoidId] : [], { varyEnergy: true });
      if (!quest) {
        app.currentDrawId = null;
        saveState();
        render();
        showToast("今天的 Quest 池已经抽完啦。");
        return;
      }
      app.currentDrawId = quest.id;
      if (activateDraw) app.activeTab = "draw";
      saveState();
      render();
      const nextTrigger = document.querySelector("[data-action='draw-next']");
      if (nextTrigger) {
        nextTrigger.classList.add("draw-press");
        window.setTimeout(() => nextTrigger.classList.remove("draw-press"), 360);
      }
      const card = document.querySelector("#drawMount .quest-card");
      if (card) {
        card.classList.add("draw-pop");
        window.setTimeout(() => card.classList.remove("draw-pop"), 320);
      }
      showToast("抽到新的 Quest 了。");
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function showToast(message, action = null) {
      const toast = document.getElementById("toast");
      toast.innerHTML = "";
      const text = document.createElement("span");
      text.className = "toast-message";
      text.textContent = message;
      toast.appendChild(text);
      if (action && typeof action.onClick === "function") {
        const button = document.createElement("button");
        button.className = "toast-action";
        button.type = "button";
        button.textContent = action.label || "撤回";
        button.onclick = () => {
          clearTimeout(toastTimer);
          toast.classList.remove("show");
          action.onClick();
        };
        toast.appendChild(button);
      }
      toast.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove("show"), action?.duration || 1800);
    }

    document.querySelectorAll(".tab-btn").forEach(button => {
      button.addEventListener("click", () => {
        app.activeTab = button.dataset.tab;
        saveState();
        render();
      });
    });

    document.getElementById("exportBtn").addEventListener("click", exportBackup);

    document.getElementById("importBtn").addEventListener("click", () => {
      document.getElementById("backupInput").click();
    });

    document.getElementById("backupInput").addEventListener("change", event => {
      const file = event.currentTarget.files?.[0];
      importBackup(file);
      event.currentTarget.value = "";
    });

    document.getElementById("questForm").addEventListener("submit", event => {
      event.preventDefault();
      const form = new FormData(event.currentTarget);
      const title = String(form.get("title") || "").trim();
      if (!title) return;
      const energy = String(form.get("energy") || "low");
      app.quests.unshift(makeQuest({
        title,
        category: String(form.get("category")),
        energy,
        duration: normalizeDuration(energy, Number(form.get("duration"))),
        tags: []
      }, app.quests.length + 1));
      event.currentTarget.reset();
      setCustomSelect("category", Object.keys(categories)[0], false);
      setCustomSelect("energy", "low", false);
      setCustomSelect("duration", "5", false);
      app.poolFilter = "全部";
      saveState();
      render();
      showToast("新 Quest 已经长进池子里。");
    });

    setRandomBrandMark();
    ensureDaily();
    render();
  </script>
</body>
</html>
